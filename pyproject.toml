[project]
name = "forgepulse-industrial-iot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pymodbus==3.11.3", "paho-mqtt>=2,<3"]

[project.optional-dependencies]
camera = ["opencv-python>=4.10,<5"]
test = ["pytest", "httpx", "amqtt>=0.12,<0.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "shared", "vm"]
